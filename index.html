<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AdCast | Sinalização Digital</title>
    
    <!-- PWA Meta Tags -->
    <link id="manifest-link" rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AdCast" />

    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <script>
      window.__ADCAST_MOUNTED__ = false;
      window.addEventListener('error', function(e) {
        console.error('AdCast error caught:', e);
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && !window.__ADCAST_MOUNTED__ && !document.getElementById('adcast-err-dialog')) {
            var errorMsg = (e && e.message) || (e && e.error && e.error.message) || 'Erro ao carregar os módulos da aplicação';
            root.innerHTML = '<div id="adcast-err-dialog" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 24px;">' +
              '<div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); padding: 24px; border-radius: 16px; max-width: 540px; margin-bottom: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">' +
              '<div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>' +
              '<h3 style="color: #f87171; margin: 0 0 10px 0; font-size: 20px; font-weight: 700;">Erro ao Iniciar o AdCast</h3>' +
              '<p style="color: #cbd5e1; font-size: 14px; margin: 0 0 16px 0; font-family: monospace; background: #020617; padding: 10px; border-radius: 8px; overflow-x: auto; text-align: left;">' + errorMsg + '</p>' +
              '<p style="color: #94a3b8; font-size: 13px; margin: 0; line-height: 1.5;">Se você fez deploy no <strong>Netlify</strong>, certifique-se de configurar a pasta de publicação como <code>dist</code> (ou arrastar a pasta <code>dist</code> após rodar <code>npm run build</code>).</p>' +
              '</div>' +
              '<div style="display: flex; gap: 12px;">' +
              '<button onclick="window.location.reload();" style="padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Tentar Novamente</button>' +
              '<button onclick="localStorage.clear(); if(window.caches) caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});}); window.location.reload();" style="padding: 12px 24px; background: #334155; color: #cbd5e1; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Limpar Cache Total</button>' +
              '</div>' +
              '</div>';
          }
        }, 1500);
      });
    </script>
</head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 4px solid #1e293b; border-top-color: #6366f1; border-radius: 50%; animation: adcast-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 6px 0; color: #ffffff; letter-spacing: -0.5px;">ADCAST</h2>
        <p style="font-size: 14px; color: #94a3b8; margin: 0;">Carregando sistema de sinalização digital...</p>
        <style>
          @keyframes adcast-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      // Captura o prompt de instalação para uso no React
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // Lógica para tornar o Manifesto Dinâmico por Player
      function updateDynamicManifest() {
        const hash = window.location.hash;
        const isPlayer = hash.startsWith('#player/');
        
        fetch('/manifest.json')
          .then(response => {
            if (!response.ok) throw new Error('Manifest not found');
            return response.json();
          })
          .then(manifest => {
            if (isPlayer) {
              manifest.start_url = window.location.pathname + window.location.search + hash;
              manifest.short_name = "Player " + hash.split('/').pop().substring(0, 4);
            } else {
              manifest.start_url = "/";
            }
            
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            const link = document.querySelector('#manifest-link');
            if (link) link.setAttribute('href', manifestURL);
          })
          .catch(err => {
            console.warn('Manifest update skipped:', err);
          });
      }

      window.addEventListener('load', updateDynamicManifest);
      window.addEventListener('hashchange', updateDynamicManifest);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('AdCast PWA: Ativo'))
            .catch(err => console.log('AdCast PWA: Erro', err));
        });
      }

      document.addEventListener('touchmove', (e) => {
        if (window.location.hash.includes('player')) {
          if (e.touches.length > 1) e.preventDefault();
        }
      }, { passive: false });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
