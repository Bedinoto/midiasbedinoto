<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AdCast | Sinalização Digital</title>
    
    <!-- PWA Meta Tags -->
    <link id="manifest-link" rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AdCast" />

    <link rel="stylesheet" href="/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script>
      // Captura o prompt de instalação para uso no React
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // Lógica para tornar o Manifesto Dinâmico por Player
      function updateDynamicManifest() {
        const hash = window.location.hash;
        const isPlayer = hash.startsWith('#player/');
        
        fetch('/manifest.json')
          .then(response => {
            if (!response.ok) throw new Error('Manifest not found');
            return response.json();
          })
          .then(manifest => {
            if (isPlayer) {
              manifest.start_url = window.location.pathname + window.location.search + hash;
              manifest.short_name = "Player " + hash.split('/').pop().substring(0, 4);
            } else {
              manifest.start_url = "/";
            }
            
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            const link = document.querySelector('#manifest-link');
            if (link) link.setAttribute('href', manifestURL);
          })
          .catch(err => {
            console.warn('Manifest update skipped:', err);
          });
      }

      window.addEventListener('load', updateDynamicManifest);
      window.addEventListener('hashchange', updateDynamicManifest);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('AdCast PWA: Ativo'))
            .catch(err => console.log('AdCast PWA: Erro', err));
        });
      }

      document.addEventListener('touchmove', (e) => {
        if (window.location.hash.includes('player')) {
          if (e.touches.length > 1) e.preventDefault();
        }
      }, { passive: false });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
