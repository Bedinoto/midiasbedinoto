<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AdCast | Sinalização Digital</title>
    
    <!-- PWA Meta Tags -->
    <link id="manifest-link" rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AdCast" />

    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.36.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      // Captura o prompt de instalação para uso no React
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // Lógica para tornar o Manifesto Dinâmico por Player
      function updateDynamicManifest() {
        const hash = window.location.hash;
        const isPlayer = hash.startsWith('#player/');
        
        fetch('manifest.json')
          .then(response => response.json())
          .then(manifest => {
            if (isPlayer) {
              manifest.start_url = window.location.pathname + window.location.search + hash;
              manifest.short_name = "Player " + hash.split('/').pop().substring(0, 4);
            } else {
              manifest.start_url = "/";
            }
            
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            document.querySelector('#manifest-link').setAttribute('href', manifestURL);
          });
      }

      window.addEventListener('load', updateDynamicManifest);
      window.addEventListener('hashchange', updateDynamicManifest);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('AdCast PWA: Ativo'))
            .catch(err => console.log('AdCast PWA: Erro', err));
        });
      }

      document.addEventListener('touchmove', (e) => {
        if (window.location.hash.includes('player')) {
          if (e.touches.length > 1) e.preventDefault();
        }
      }, { passive: false });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
